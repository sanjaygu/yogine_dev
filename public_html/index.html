<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yogine.dev — AI coding training and enterprise solutions</title>
<meta name="description" content="AI coding training for developers and solutions for enterprises: hardened skills and agents, and a governance framework for security, compliance and LLM cost. Start with a free 90-minute Foundation session.">
<meta name="theme-color" content="#14171c">
<link rel="canonical" href="https://yogine.dev/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2314171c'/%3E%3Ctext x='32' y='47' font-size='44' text-anchor='middle' font-family='Georgia,serif' font-weight='700' fill='%23d9a635'%3Ey%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:site_name" content="yogine.dev">
<meta property="og:title" content="yogine.dev — AI coding training and enterprise solutions">
<meta property="og:description" content="AI coding training for developers and solutions for enterprises: hardened skills and agents, and a governance framework for security, compliance and LLM cost. Start with a free 90-minute Foundation session.">
<meta property="og:url" content="https://yogine.dev/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c;
    --ink-2:#1b1f26;
    --panel:#20242c;
    --rule:#333a45;
    --paper:#ece8de;
    --paper-dim:#a9a79d;
    --amber:#d9a635;
    --amber-dim:#b6883f;
    --teal:#4c8c81;
    --rust:#c1573b;
    --radius-s:3px;
    --radius-m:6px;
    --maxw:1120px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0 0 .4em 0;
    line-height:1.12;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  p{margin:0 0 1em 0; max-width:62ch;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40;
    background:rgba(20,23,28,.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);
  }
  .header-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px;
    max-width:var(--maxw); margin:0 auto;
  }
  .logo{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.28rem;
    text-decoration:none; color:var(--paper);
    letter-spacing:-0.01em;
  }
  .logo span{color:var(--amber);}
  nav.primary-nav{display:flex; align-items:center; gap:30px;}
  nav.primary-nav a{
    text-decoration:none; color:var(--paper-dim); font-size:.94rem;
    padding:6px 2px; border-bottom:2px solid transparent;
  }
  nav.primary-nav a:hover, nav.primary-nav a.active{color:var(--paper); border-bottom-color:var(--amber);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:11px 20px; border-radius:var(--radius-s);
    font-size:.92rem; font-weight:500; text-decoration:none;
    border:1px solid transparent; cursor:pointer;
    background:transparent; -webkit-appearance:none; appearance:none; font-family:inherit;
  }
  .btn-primary{background:var(--amber); color:#1a1508;}
  .btn-primary:hover{background:#e6b346;}
  .btn-ghost{border-color:var(--rule); color:var(--paper); background:transparent;}
  .btn-ghost:hover{border-color:var(--paper-dim);}
  .nav-toggle{display:none; background:none; border:1px solid var(--rule); color:var(--paper); padding:8px 10px; border-radius:var(--radius-s);}

  @media (max-width:820px){
    nav.primary-nav{
      position:absolute; top:100%; left:0; right:0; background:var(--ink-2);
      flex-direction:column; align-items:flex-start; gap:0;
      max-height:0; overflow:hidden; visibility:hidden;
      transition:max-height .25s ease, visibility 0s linear .25s;
    }
    nav.primary-nav.open{
      max-height:400px; visibility:visible; border-bottom:1px solid var(--rule);
      transition:max-height .25s ease, visibility 0s;
    }
    nav.primary-nav a{width:100%; padding:16px 28px; border-bottom:1px solid var(--rule);}
    nav.primary-nav a.active{border-bottom:1px solid var(--rule); box-shadow:inset 3px 0 0 var(--amber);}
    .nav-toggle{display:inline-flex;}
    .header-cta{padding:9px 12px; font-size:.85rem;}
    .header-row{padding:14px 20px;}
  }

  /* ---------- Hero ---------- */
  .hero{padding:72px 0 64px;}
  .hero-grid{display:grid; grid-template-columns:1.1fr 1fr; gap:56px; align-items:center;}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;}}
  .eyebrow-line{
    display:flex; align-items:center; gap:10px; color:var(--teal);
    font-family:'IBM Plex Mono', monospace; font-size:.8rem; margin-bottom:18px;
  }
  .eyebrow-line::before{content:''; width:22px; height:1px; background:var(--teal);}
  .hero h1{font-size:2.7rem; max-width:14ch;}
  .hero .lede{font-size:1.08rem; color:var(--paper-dim); max-width:44ch;}
  .hero-actions{display:flex; gap:14px; margin-top:26px; flex-wrap:wrap;}

  .term-window{
    border:1px solid var(--rule); border-radius:var(--radius-m); overflow:hidden;
    background:var(--panel); box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
  }
  .term-bar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-bottom:1px solid var(--rule); background:var(--ink-2);
  }
  .term-dot{width:9px; height:9px; border-radius:50%; background:var(--rule);}
  .term-title{margin-left:10px; font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--paper-dim);}
  .term-body{padding:20px; font-family:'IBM Plex Mono', monospace; font-size:.82rem;}
  .term-col-label{color:var(--paper-dim); font-size:.72rem; text-transform:none; margin-bottom:10px;}
  .term-row{display:flex; gap:8px; margin-bottom:9px; align-items:flex-start;}
  .term-row .mark{width:14px; flex-shrink:0;}
  .term-row.bad .mark{color:var(--rust);}
  .term-row.good .mark{color:var(--teal);}
  .term-divider{height:1px; background:var(--rule); margin:16px 0;}

  /* ---------- Sections ---------- */
  section{padding:64px 0;}
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:36px; flex-wrap:wrap;}
  .section-head h2{font-size:1.9rem; max-width:16ch;}
  .section-head .desc{color:var(--paper-dim); max-width:42ch; font-size:.98rem;}

  .stat-strip{border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:22px 0;}
  .stat-strip .wrap{display:flex; gap:40px; flex-wrap:wrap; color:var(--paper-dim); font-size:.9rem; font-family:'IBM Plex Mono', monospace;}
  .stat-strip strong{color:var(--paper); font-family:'IBM Plex Sans', sans-serif; font-weight:600;}

  /* Course list — numbered progression, not cards-with-shadows */
  .course-list{border-top:1px solid var(--rule);}
  .course-row{
    display:grid; grid-template-columns:64px 1.4fr 1.6fr auto; gap:28px;
    padding:30px 0; border-bottom:1px solid var(--rule); align-items:start;
  }
  @media (max-width:760px){.course-row{grid-template-columns:40px 1fr; }
    .course-row .course-mid, .course-row .course-cta{grid-column:1 / -1;}
  }
  .course-index{font-family:'IBM Plex Mono', monospace; color:var(--amber-dim); font-size:.95rem; padding-top:4px;}
  .course-name h3{font-size:1.28rem; margin-bottom:6px;}
  .course-level{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.7rem;
    color:var(--teal); border:1px solid var(--teal); border-radius:20px; padding:2px 10px; margin-bottom:10px;
  }
  .course-audience{
    font-size:.86rem; color:var(--paper-dim); margin:6px 0 0; padding-left:14px;
    border-left:2px solid var(--rule); max-width:36ch;
  }
  .course-value{
    font-size:.9rem; color:var(--paper); margin:14px 0 0; padding-left:14px;
    border-left:2px solid var(--amber); max-width:40ch;
  }
  .course-bullets{margin:0; padding:0; list-style:none;}
  .course-bullets li{
    position:relative; padding-left:18px; margin-bottom:8px; font-size:.94rem; color:var(--paper-dim);
  }
  .course-bullets li::before{content:'–'; position:absolute; left:0; color:var(--rule);}
  .course-cta{display:flex; flex-direction:column; gap:10px; align-items:flex-end; padding-top:4px;}
  @media (max-width:760px){.course-cta{align-items:flex-start;}}
  .price-tag{font-family:'IBM Plex Mono', monospace; font-size:1.05rem;}
  .price-was{
    font-family:'IBM Plex Mono', monospace; font-size:.82em; color:var(--paper-dim);
    text-decoration:line-through; margin-right:6px;
  }
  .discount-badge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.7rem;
    color:var(--rust); border:1px solid var(--rust); border-radius:20px; padding:2px 9px;
  }
  .price-note{font-size:.74rem; color:var(--paper-dim);}
  .discount-hint{font-size:.8rem; color:var(--paper-dim); margin-top:10px;}
  .promo-banner{
    background:var(--amber); color:#1a1508; font-family:'IBM Plex Mono', monospace;
    font-size:.85rem; text-align:center; padding:12px 16px; border-radius:var(--radius-s);
    margin-bottom:28px;
  }
  .promo-banner strong{font-weight:700; letter-spacing:.02em;}
  .start-note{
    font-family:'IBM Plex Mono', monospace; font-size:.68em; font-weight:400;
    color:var(--teal); vertical-align:middle;
  }

  /* Events */
  .event-table{border-top:1px solid var(--rule);}
  .session-note{
    margin-top:24px; font-size:.92rem; color:var(--paper-dim);
  }
  .session-note a{color:var(--amber); text-decoration:none;}
  .session-note a:hover{text-decoration:underline;}
  .event-row{
    display:grid; grid-template-columns:1fr 130px 160px auto; gap:20px;
    padding:20px 0; border-bottom:1px solid var(--rule); align-items:center;
  }
  @media (max-width:760px){.event-row{grid-template-columns:1fr; gap:6px;}}
  .event-course{font-weight:500;}
  .event-date{font-family:'IBM Plex Mono', monospace; color:var(--paper-dim); font-size:.85rem;}
  .event-loc{color:var(--paper-dim); font-size:.85rem;}
  .event-address{color:var(--paper-dim); font-size:.78rem; opacity:.8; margin-top:2px;}
  .venue-link{color:var(--teal); text-decoration:none;}
  .venue-link:hover{text-decoration:underline;}
  .event-row .btn{white-space:nowrap;}

  footer{border-top:1px solid var(--rule); padding:44px 0; color:var(--paper-dim); font-size:.85rem;}
  footer .foot-row{display:flex; justify-content:space-between; flex-wrap:wrap; gap:20px;}

  /* ---------- Forms / signup ---------- */
  .form-page{padding:56px 0 90px;}
  .steps{display:flex; gap:0; margin-bottom:44px; border:1px solid var(--rule); border-radius:var(--radius-m); overflow:hidden;}
  .step{flex:1; padding:14px 12px; text-align:center; font-size:.8rem; color:var(--paper-dim); border-right:1px solid var(--rule); font-family:'IBM Plex Mono', monospace;}
  .step:last-child{border-right:none;}
  .step .num{display:block; font-family:'Fraunces', serif; font-size:1.1rem; color:var(--paper-dim); margin-bottom:2px;}
  .step.active{background:var(--panel); color:var(--paper);}
  .step.active .num{color:var(--amber);}
  .step.done{color:var(--teal);}
  .step.done .num{color:var(--teal);}

  .form-card{max-width:640px;}
  .field{margin-bottom:22px;}
  .field label{display:block; font-size:.86rem; color:var(--paper-dim); margin-bottom:7px;}
  .optional-tag{font-size:.78em; opacity:.75;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--ink-2); border:1px solid var(--rule); color:var(--paper);
    padding:12px 14px; border-radius:var(--radius-s); font-size:.95rem; font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber);}
  .field textarea{min-height:100px; resize:vertical;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  @media (max-width:600px){.field-row{grid-template-columns:1fr;}}
  .field-error{color:var(--rust); font-size:.78rem; margin-top:6px; display:none;}
  .field.invalid input, .field.invalid select, .field.invalid textarea{border-color:var(--rust);}
  .field.invalid .field-error{display:block;}
  .form-actions{display:flex; justify-content:space-between; align-items:center; margin-top:32px; gap:14px;}
  .session-pick{border:1px solid var(--rule); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:pointer;}
  .session-pick input{width:auto;}
  .session-pick.selected{border-color:var(--amber);}
  .summary-box{border:1px solid var(--rule); border-radius:var(--radius-m); padding:20px 22px; margin-bottom:28px; background:var(--panel);}
  .summary-row{display:flex; justify-content:space-between; padding:7px 0; font-size:.92rem; border-bottom:1px solid var(--rule);}
  .summary-row:last-child{border-bottom:none; font-weight:600; padding-top:12px;}
  .disclaimer{font-size:.78rem; color:var(--paper-dim); border-left:2px solid var(--teal); padding-left:12px; margin-top:20px;}
  .policy-list{margin:14px 0 0; padding:0; list-style:none;}
  .policy-list li{position:relative; padding-left:20px; margin-bottom:10px; color:var(--paper-dim); font-size:.95rem;}
  .policy-list li::before{content:'–'; position:absolute; left:0; color:var(--rule);}
  .policy-list li strong{color:var(--paper);}
  .confirm-box{text-align:center; max-width:520px; margin:0 auto; padding:40px 0;}
  .confirm-mark{font-family:'IBM Plex Mono', monospace; color:var(--teal); font-size:.85rem; margin-bottom:14px;}

  .card-icons{display:flex; gap:8px; font-family:'IBM Plex Mono', monospace; font-size:.7rem; color:var(--paper-dim);}

  .wallet-note{color:var(--paper-dim); font-size:.9rem; margin-bottom:20px;}
  .wallet-btn{width:100%; justify-content:center; padding:14px; font-size:.98rem;}
  .qr-box{
    background:#f2efe6; border-radius:var(--radius-m); padding:24px;
    display:inline-flex; flex-direction:column; align-items:center; gap:12px;
  }
  .qr-box img{display:block; width:180px; height:180px; border-radius:2px;}
  .qr-caption{font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:#4a4638; text-align:center; max-width:22ch;}
  .qr-link{font-size:.78rem; color:var(--paper-dim); word-break:break-all; margin-top:14px;}
  .processing{display:flex; align-items:center; gap:10px; color:var(--paper-dim); font-size:.9rem;}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--rule); border-top-color:var(--amber); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .pay-divider{
    display:flex; align-items:center; gap:12px; margin:4px 0 20px;
    color:var(--paper-dim); font-size:.78rem;
  }
  .pay-divider::before, .pay-divider::after{content:''; flex:1; height:1px; background:var(--rule);}

  /* Trust callout around the redirect to Stripe */
  .stripe-callout{
    border:1px solid var(--rule); border-left:3px solid #7a73ff;
    border-radius:var(--radius-m); padding:22px 24px; margin-bottom:24px;
  }
  .stripe-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:.78rem;
    color:var(--paper-dim); margin-bottom:12px;
  }
  .stripe-mention{color:#9b95ff; font-weight:700;}
  .btn-stripe{background:#635bff; color:#fff;}
  .btn-stripe:hover{background:#544ee0;}
  .btn-stripe strong{font-weight:700;}

  /* ---------- Additions ---------- */
  .visually-hidden{
    position:absolute; width:1px; height:1px; margin:-1px; padding:0;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  .skip-link{
    position:absolute; left:16px; top:-60px; z-index:60;
    background:var(--amber); color:#1a1508; padding:10px 16px; border-radius:var(--radius-s);
    text-decoration:none; font-weight:500;
  }
  .skip-link:focus{top:12px;}
  [tabindex="-1"]:focus{outline:none;}
  .noscript-note{max-width:640px; margin:0 auto; padding:64px 28px;}

  fieldset.field{border:0; padding:0; min-width:0;}
  fieldset.field legend{font-size:.86rem; color:var(--paper-dim); margin-bottom:7px; padding:0;}
  .session-pick:focus-within{outline:2px solid var(--amber); outline-offset:2px;}
  .form-note{font-size:.82rem; color:var(--paper-dim); margin:0;}
  .form-note a{color:var(--amber);}
  button:disabled{opacity:.55; cursor:not-allowed;}
  .btn-stripe:disabled{cursor:default;}
  footer .foot-links a{color:var(--paper-dim); font-size:.9rem; margin-right:18px;}

  .agenda{margin:0; padding:0; list-style:none; border-top:1px solid var(--rule);}
  .agenda li{display:grid; grid-template-columns:64px 1fr; gap:20px; padding:22px 0; border-bottom:1px solid var(--rule);}
  .agenda h3{font-size:1.1rem; margin-bottom:4px;}
  .agenda p{margin:0; color:var(--paper-dim); font-size:.94rem;}
  @media (max-width:760px){.agenda li{grid-template-columns:40px 1fr; gap:12px;}}
  .two-col{display:grid; grid-template-columns:1fr 1.4fr; gap:56px; align-items:start;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr; gap:40px;}}
  .faq details{border-bottom:1px solid var(--rule); padding:16px 0;}
  .faq details:first-of-type{border-top:1px solid var(--rule);}
  .faq summary{cursor:pointer; font-weight:500;}
  .faq details p{margin:10px 0 0; color:var(--paper-dim); font-size:.94rem;}
  .faq details a{color:var(--amber);}
  .hero h1.wide{max-width:20ch;}
  .paths{border:1px solid var(--rule); border-radius:var(--radius-m); overflow:hidden;}
  .path-card{display:block; padding:28px; text-decoration:none; color:inherit; background:var(--panel);}
  .path-card + .path-card{border-top:1px solid var(--rule);}
  .path-card:hover{background:var(--ink-2);}
  .path-card h2{font-size:1.45rem; margin-bottom:6px;}
  .path-card p{margin:0 0 14px; color:var(--paper-dim); font-size:.95rem;}
  .path-audience{font-family:'IBM Plex Mono', monospace; font-size:.75rem; color:var(--teal); margin-bottom:8px;}
  .path-go{color:var(--amber); font-size:.92rem; font-weight:500;}
  .path-card:hover .path-go{text-decoration:underline;}

  .risk-grid{display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--rule); border-left:1px solid var(--rule);}
  .risk-grid > div{padding:24px 26px; border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);}
  .risk-grid h3{font-size:1.1rem; margin-bottom:6px;}
  .risk-grid p{margin:0; color:var(--paper-dim); font-size:.94rem;}
  @media (max-width:700px){.risk-grid{grid-template-columns:1fr;}}

  .cols-3{display:grid; grid-template-columns:repeat(3, 1fr); border-top:1px solid var(--rule);}
  .cols-3 > div{padding:26px 26px 8px 0;}
  .cols-3 > div + div{padding-left:26px; border-left:1px solid var(--rule);}
  .cols-3 h3{font-size:1.2rem; margin-bottom:12px;}
  .cols-3 p{margin:0; color:var(--paper-dim); font-size:.94rem;}
  @media (max-width:820px){
    .cols-3{grid-template-columns:1fr; border-top:0;}
    .cols-3 > div, .cols-3 > div + div{padding:24px 0 8px; border-left:0; border-top:1px solid var(--rule);}
  }

  .cta-band{border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:48px 0;}
  .cta-band .wrap{display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap;}
  .cta-band h2{font-size:1.7rem; margin:0 0 6px;}
  .cta-band p{margin:0; color:var(--paper-dim);}

  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
  .form-error{color:var(--rust); font-size:.85rem; margin:14px 0 0;}
</style>
</head>
<body>

<a class="skip-link" id="skipLink" href="#/">Skip to main content</a>

<header class="site-header">
  <div class="header-row">
    <a href="#/" class="logo">yogine<span>.dev</span></a>
    <nav class="primary-nav" id="primaryNav" aria-label="Main">
      <a href="#/" data-route="/">Home</a>
      <a href="#/training" data-route="/training">Training</a>
      <a href="#/solutions" data-route="/solutions">Solutions</a>
      <a href="#/events" data-route="/events">Upcoming sessions</a>
    </nav>
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="#/signup" id="headerCta" class="btn btn-primary header-cta">Reserve a seat</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="primaryNav">☰</button>
    </div>

  return String(v == null ? '' : v).replace(/[&<>"']/g, c => (

}

function isUpcoming(ev){ return new Date(ev.end + 'T23:59:59') >= new Date(); }

   pre-fills it. The QR code never does: it is drawn by a third-party image
   service, so it only ever encodes the bare link plus a course/session
   reference. */
function referenceId(slug){
  return [slug, wizard.eventId].filter(Boolean).join('_').replace(/[^A-Za-z0-9_-]/g, '');
}
function stripeLinkFor(slug, opts){
  const base = STRIPE_PAYMENT_LINKS[slug];
  if (!base) return null;
  const params = new URLSearchParams();
  if (opts && opts.prefillEmail && wizard.email) params.set('prefilled_email', wizard.email);
  const ref = referenceId(slug);
  if (ref) params.set('client_reference_id', ref);
  const qs = params.toString();
  return qs ? `${base}${base.includes('?') ? '&' : '?'}${qs}` : base;
}
function qrImageSrc(data){

}

function captureLead(){
  if (!LEAD_WEBHOOK_URL) return;
  if (wizard.leadSentFor === wizard.email) return; // already sent for this email
  const course = wizard.courseSlug ? courseBySlug(wizard.courseSlug) : null;
  const session = wizard.eventId ? eventById(wizard.eventId) : null;
  const payload = {
    timestamp: new Date().toISOString(),
    name: wizard.name,
    email: wizard.email,
    phone: wizard.phone,
    codingExperience: wizard.codingExp,
    aiExperience: wizard.aiExp,
    expectations: wizard.expectations,
    course: course ? course.name : '',
    session: session ? `${session.date} · ${eventLocation(session)}` : ''
  };
  wizard.leadSentFor = wizard.email;
  saveWizard();
  // no-cors: Apps Script web apps send no CORS headers; the write still happens.
  try {
    fetch(LEAD_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  } catch (err) { /* never block the person's flow */ }
}

function injectEventSchema(){

      description: c.audience,

      endDate: ev.endAt || ev.end,
      eventStatus: 'https://schema.org/EventScheduled',
      organizer: { '@type': 'Organization', name: 'yogine.dev', url: SITE_URL },
      offers: {
        '@type': 'Offer',
        price: String(c.price),
        priceCurrency: 'USD',
        availability: 'https://schema.org/InStock',
        url: `${SITE_URL}#/signup?course=${c.slug}&event=${ev.id}`
      }
    };
    if (ev.virtual){
      item.eventAttendanceMode = 'https://schema.org/OnlineEventAttendanceMode';
      item.location = { '@type': 'VirtualLocation', url: SITE_URL };
    } else {
      item.eventAttendanceMode = 'https://schema.org/OfflineEventAttendanceMode';
      item.location = {
        '@type': 'Place',
        name: ev.venue.name,
        address: {
          '@type': 'PostalAddress',

          addressLocality: ev.venue.city,
          addressRegion: ev.venue.region,
          postalCode: ev.venue.zip,
          addressCountry: 'US'
        }
      };
    }
    return item;
  });

  tag.type = 'application/ld+json';
  tag.textContent = JSON.stringify({ '@context': 'https://schema.org', '@graph': items });
  document.head.appendChild(tag);
}

function parseHash(){

  if (!location.hash && new URLSearchParams(location.search).get('registered') === '1'){
    return { path: '/registered', params: new URLSearchParams() };
  }
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const p = path || '/';
  return { path: p === '/courses' ? '/training' : p, params: new URLSearchParams(qs || '') }; // /courses is the old URL
}

function navigate(hash){ location.hash = hash; }

function setActiveNav(path){

  });
}

    '/solutions': 'Solutions — yogine.dev',

    '/privacy': 'Privacy notice — yogine.dev',
    '/registered': 'Thank you — yogine.dev'
  };
  if (t[path]) return t[path];
  if (path.indexOf('/signup') === 0) return 'Reserve a seat — yogine.dev';
  return t['/'];
}

let firstRender = true;
function render(){
  const { path, params } = parseHash();
  setActiveNav(path);
  setHeaderCta(path);
  document.title = titleFor(path);
  window.scrollTo(0, 0);

  if (path === '/') renderHome();
  else if (path === '/training') renderTraining();
  else if (path === '/solutions') renderSolutions();
  else if (path === '/events') renderEvents();
  else if (path === '/signup') renderSignupStep1(params);
  else if (path === '/signup/course') renderSignupStep2(params);
  else if (path === '/signup/payment') renderSignupStep3();
  else if (path === '/registered') renderRegistered(params);
  else if (path === '/refund-policy') renderRefundPolicy();
  else if (path === '/privacy') renderPrivacy();
  else renderHome();

  if (!firstRender){
    const heading = app.querySelector('h1, h2');
    if (heading){
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  }
  firstRender = false;
}

function renderSignupStep2(params){
  if (!wizard.name || !wizard.email) return navigate('/signup');

  const bookable = COURSES.filter(c => !c.custom); // Enterprise isn't self-serve
  const defaultSlug = bookable.find(c => c.slug === 'professional') ? 'professional' : bookable[0].slug;
  let preCourse = params.get('course') || wizard.courseSlug || defaultSlug;
  if (!bookable.find(c => c.slug === preCourse)) preCourse = defaultSlug;
  const preEvent = params.get('event') || wizard.eventId || '';
  wizard.courseSlug = preCourse;

  app.innerHTML = `
  <div class="form-page wrap">
    ${stepsBar(2)}
    <div class="form-card">
      <h2>Choose your course and session</h2>
      <p style="color:var(--paper-dim); margin-bottom:28px;">You can change either selection any time before payment.</p>

      <div class="field">
        <label for="courseSelect">Course</label>
        <select id="courseSelect">
          ${bookable.map(c => `<option value="${c.slug}" ${c.slug === preCourse ? 'selected' : ''}>${c.name} — ${c.free ? 'Free' : '$' + c.price}</option>`).join('')}
        </select>
      </div>

      <fieldset class="field">
        <legend>Session</legend>
        <div id="sessionList"></div>
      </fieldset>

      <div class="hp" aria-hidden="true"><label>Leave this field empty<input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="form-error" id="regError" role="alert" hidden></p>

      <div class="form-actions">
        <button class="btn btn-ghost" id="backStep1">Back</button>
        <button class="btn btn-primary" id="toStep3">Continue to payment</button>
      </div>
    </div>
  </div>`;

  const continueBtn = document.getElementById('toStep3');
  const selectedIsFree = () => { const c = courseBySlug(wizard.courseSlug); return !!(c && c.free); };
  const refreshContinueLabel = () => { continueBtn.textContent = selectedIsFree() ? 'Complete registration' : 'Continue to payment'; };

  function paintSessions(slug, selectedEventId){
    const list = upcomingEventsFor(slug);
    const box = document.getElementById('sessionList');
    continueBtn.disabled = list.length === 0;
    if (!list.length){
      box.innerHTML = `<p class="session-note" style="margin:0;">No upcoming sessions for this course right now. <a href="${SESSION_REQUEST_CONTACT}">Write to us</a> and we'll add one.</p>`;
      return;
    }
    box.innerHTML = list.map(ev => `
      <label class="session-pick ${ev.id === selectedEventId ? 'selected' : ''}" data-event="${ev.id}">
        <span>
          <strong style="font-family:'IBM Plex Mono',monospace; font-size:.85rem;">${ev.date}</strong><br>
          <span style="color:var(--paper-dim); font-size:.85rem;">${eventLocation(ev)}</span>
        </span>
        <input type="radio" name="session" value="${ev.id}" ${ev.id === selectedEventId ? 'checked' : ''}>
      </label>
    `).join('');
    box.querySelectorAll('input[name="session"]').forEach(input => {
      input.addEventListener('change', () => {
        box.querySelectorAll('.session-pick').forEach(el => el.classList.toggle('selected', el.dataset.event === input.value));
        wizard.eventId = input.value;
        saveWizard();
      });
    });
  }

  const sessions = upcomingEventsFor(preCourse);
  const initialEvent = sessions.find(s => s.id === preEvent) ? preEvent : (sessions[0] ? sessions[0].id : '');
  wizard.eventId = initialEvent;
  saveWizard();
  paintSessions(preCourse, initialEvent);
  refreshContinueLabel();

  document.getElementById('courseSelect').addEventListener('change', (e) => {
    wizard.courseSlug = e.target.value;
    const list = upcomingEventsFor(e.target.value);
    wizard.eventId = list[0] ? list[0].id : '';
    saveWizard();
    paintSessions(e.target.value, wizard.eventId);
    refreshContinueLabel();
  });

  document.getElementById('backStep1').addEventListener('click', () => navigate('/signup'));
  continueBtn.addEventListener('click', () => {
    if (!wizard.eventId) return;
    saveWizard();
    if (selectedIsFree()) submitFreeRegistration(continueBtn);
    else navigate('/signup/payment');
  });
}

/* ---- Free sessions: register directly, no payment step ---- */
function submitFreeRegistration(button){
  const course = courseBySlug(wizard.courseSlug);
  const ev = eventById(wizard.eventId);
  const errorBox = document.getElementById('regError');
  errorBox.hidden = true;
  button.disabled = true;
  button.textContent = 'Registering…';

  const payload = {
    name: wizard.name, email: wizard.email, phone: wizard.phone,
    codingExperience: wizard.codingExp, aiExperience: wizard.aiExp, expectations: wizard.expectations,
    course: course.slug, event: ev.id,
    website: document.getElementById('website').value // honeypot: real visitors leave it empty
  };

  fetch(REGISTER_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(res => res.json().catch(() => ({})).then(data => {
      if (!res.ok || !data.ok) throw new Error(data.error || 'Registration failed');
      navigate('/registered?type=free');
    }))
    .catch(() => {
      errorBox.textContent = "We couldn't complete your registration. Please try again, or email hello@yogine.dev and we'll register you.";
      errorBox.hidden = false;
      button.disabled = false;
      button.textContent = 'Complete registration';
    });
}

      </div>

      ${payBlock}

      <p style="font-size:.85rem; color:var(--paper-dim); margin-top:14px;">Read our <a href="#/refund-policy" style="color:var(--amber);">Refund &amp; Cancellation Policy</a> before you pay.</p>

      <div class="form-actions">
        <button class="btn btn-ghost" id="backStep2">Back</button>
      </div>
    </div>
  </div>`;

  document.getElementById('backStep2').addEventListener('click', () => navigate('/signup/course'));

  const payButton = document.getElementById('payCard');
  if (payButton){
    payButton.addEventListener('click', (e) => {
      const button = e.currentTarget;
      button.disabled = true;
      button.innerHTML = '<span class="processing"><span class="spinner"></span>Redirecting to Stripe…</span>';
      window.location.href = payUrl;
    });
  }
}

/* ---- After registering: Stripe's "after payment" redirect and the free
   sign-up flow both land here ---- */
function renderRegistered(params){
  const free = !!params && params.get('type') === 'free';
  const course = wizard.courseSlug ? courseBySlug(wizard.courseSlug) : null;
  const ev = wizard.eventId ? eventById(wizard.eventId) : null;
  const message = free
    ? `We've emailed your confirmation. Nothing after a few minutes? Check your spam folder, then write to <a href="mailto:hello@yogine.dev" style="color:var(--amber);">hello@yogine.dev</a>.`
    : `Stripe is emailing your payment receipt. We'll follow up by email with your session details and a short prep checklist. Nothing after a while? Check your spam folder, then write to <a href="mailto:hello@yogine.dev" style="color:var(--amber);">hello@yogine.dev</a>.`;
  app.innerHTML = `
  <div class="form-page wrap">
    <div class="confirm-box">
      <div class="confirm-mark">✓ ${free ? "you're registered" : 'thank you'}</div>
      <h2>${free ? 'See you there.' : 'Watch your inbox.'}</h2>
      <p style="margin:0 auto 24px;">${message}</p>
      ${course ? `
      <div class="summary-box" style="text-align:left;">
        <div class="summary-row"><span>Course</span><span>${course.name}</span></div>
        <div class="summary-row"><span>Session</span><span>${ev ? ev.date + ' · ' + eventLocation(ev) : 'To be confirmed'}</span></div>
      </div>` : ''}
      <a href="#/events" class="btn btn-ghost">Back to schedule</a>
    </div>
  </div>`;
  clearWizard();
}

function stepsBar(active){
  const labels = ['Your details', 'Course & session', 'Payment'];
  return `<div class="steps" role="list" aria-label="Registration steps">
    ${labels.map((l, i) => {
      const n = i + 1;
      const cls = n === active ? 'active' : (n < active ? 'done' : '');
      return `<div class="step ${cls}" role="listitem"${n === active ? ' aria-current="step"' : ''}><span class="num">0${n}</span>${l.replace('&', '&amp;')}</div>`;
    }).join('')}
  </div>`;
}
